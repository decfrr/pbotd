name: Linux
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check Go formatting
        run: |
          unformatted_files="$(gofmt -l cmd internal tests)"
          if [ -n "$unformatted_files" ]; then
            printf '%s\n' "$unformatted_files"
            exit 1
          fi
      - name: Go vet
        run: go vet ./...
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Unit and integration tests
        run: go test ./...
      - name: Race detection
        run: go test -race ./...
      - name: Build without CGO
        run: CGO_ENABLED=0 go build -trimpath -o bin/pbotd ./cmd/pbotd
      - name: Installer checks
        run: sh tests/install.sh
