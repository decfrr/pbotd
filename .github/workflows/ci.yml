name: Linux
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check Go formatting
        run: |
          unformatted_files="$(gofmt -l cmd internal tests)"
          if [ -n "$unformatted_files" ]; then
            printf '%s\n' "$unformatted_files"
            exit 1
          fi
      - name: Go vet
        run: go vet ./...
  test:
    name: Test and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Unit and integration tests
        run: go test ./...
      - name: Race detection
        run: go test -race ./...
      - name: Build without CGO
        run: CGO_ENABLED=0 go build -trimpath -o bin/pbotd ./cmd/pbotd
      - name: Installer checks
        run: sh tests/install.sh
      - name: Package release binary
        if: github.ref == 'refs/heads/releases' && github.event_name == 'push'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bin/pbotd --version
          mkdir -p dist
          tar -czf "dist/pbotd-linux-${ARCH}.tar.gz" -C bin pbotd
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/releases' && github.event_name == 'push'
        with:
          name: pbotd-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
